<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOC Transcript Desk</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3eee4;
      --muted: #a9a49b;
      --paper: #d8cfbc;
      --night: #111311;
      --panel: #1a1d19;
      --panel-2: #222620;
      --line: #383d34;
      --accent: #d7a958;
      --red: #e47e67;
      --green: #84b48c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--night);
      color: var(--ink);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button, select, input {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
    }
    button { padding: 0 13px; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
    button:disabled { opacity: .35; cursor: default; }
    input { min-width: 260px; padding: 0 12px; }
    select { padding: 0 34px 0 11px; }
    .app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }
    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: #151714;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
    .brand h1 { margin: 0; font: 600 20px/1.1 Georgia, serif; letter-spacing: .02em; }
    .brand span { color: var(--muted); font-size: 12px; }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .statusbar {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 18px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .identity { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badges { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font-size: 11px; }
    .badge.warn { color: #ffd0c5; border-color: #754b42; background: #321f1b; }
    .badge.good { color: #c5e8cb; border-color: #3f6547; background: #1c3020; }
    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(350px, .85fr); }
    .image-pane, .text-pane { min-width: 0; min-height: 0; }
    .image-pane { display: grid; grid-template-rows: auto 1fr; border-right: 1px solid var(--line); background: #090a09; }
    .pane-head { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: #171916; }
    .pane-head strong { font-weight: 600; letter-spacing: .02em; }
    .zoom-tools { display: flex; gap: 6px; align-items: center; }
    .zoom-tools button { min-height: 30px; min-width: 34px; padding: 0 9px; }
    #zoomLabel { width: 50px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .image-stage { overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 18px; }
    #scan { display: block; max-width: none; transform-origin: top center; background: #d9d5ca; box-shadow: 0 10px 40px #000b; }
    .text-pane { display: grid; grid-template-rows: auto 1fr auto; background: var(--panel); }
    #transcript {
      margin: 0;
      overflow: auto;
      padding: 24px 28px 36px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #eee9df;
      font: 16px/1.7 Georgia, "Times New Roman", serif;
      tab-size: 4;
      user-select: text;
    }
    .details { border-top: 1px solid var(--line); color: var(--muted); padding: 10px 14px; display: grid; gap: 4px; font-size: 12px; }
    .details a { color: var(--accent); }
    .footer {
      min-height: 58px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 9px 18px;
      border-top: 1px solid var(--line);
      background: #151714;
    }
    .nav { display: flex; gap: 8px; }
    .position { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .page-slider { width: min(620px, 100%); accent-color: var(--accent); }
    .empty { display: grid; place-items: center; color: var(--muted); font-size: 16px; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: #111311ee; color: var(--paper); letter-spacing: .04em; }
    kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: #252923; color: var(--muted); }
    @media (max-width: 850px) {
      body { overflow: auto; }
      .app { min-height: 100%; height: auto; grid-template-rows: auto auto auto auto; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .tools { justify-content: flex-start; width: 100%; }
      input { min-width: 0; flex: 1; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
      .image-pane { border-right: 0; border-bottom: 1px solid var(--line); }
      #transcript { min-height: 45vh; }
      .footer { position: sticky; bottom: 0; }
    }
  </style>
</head>
<body>
  <div id="loading">Opening the transcript desk…</div>
  <main class="app">
    <header class="topbar">
      <div class="brand"><h1>LOC Transcript Desk</h1><span>Best CHURRO · live untranscribed pages</span></div>
      <div class="tools">
        <input id="search" type="search" placeholder="Search page ID or transcript" aria-label="Search pages">
        <select id="filter" aria-label="Filter generation status">
          <option value="all">All pages</option>
          <option value="complete">Complete only</option>
          <option value="incomplete">Incomplete</option>
          <option value="truncated">Truncated</option>
          <option value="omission">Omission marker</option>
          <option value="loc_flagged">LOC review flags</option>
        </select>
        <button id="copy" type="button">Copy transcript</button>
        <button id="download" type="button">Download .txt</button>
      </div>
    </header>
    <section class="statusbar">
      <div id="identity" class="identity">Loading pages…</div>
      <div id="badges" class="badges"></div>
    </section>
    <section id="workspace" class="workspace">
      <section class="image-pane">
        <div class="pane-head">
          <strong>Original scan</strong>
          <div class="zoom-tools">
            <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
            <span id="zoomLabel">Fit</span>
            <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
            <button id="fit" type="button">Fit</button>
          </div>
        </div>
        <div id="imageStage" class="image-stage"><img id="scan" alt="Selected LOC page scan"></div>
      </section>
      <section class="text-pane">
        <div class="pane-head"><strong>Best CHURRO transcript</strong><span id="charCount"></span></div>
        <pre id="transcript"></pre>
        <div id="details" class="details"></div>
      </section>
    </section>
    <footer class="footer">
      <div class="nav"><button id="previous" type="button">← Previous</button><button id="next" type="button">Next →</button></div>
      <div class="position"><input id="slider" class="page-slider" type="range" min="0" max="0" value="0"><div id="positionText">0 of 0</div></div>
      <div><kbd>←</kbd> <kbd>→</kbd> navigate</div>
    </footer>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    const state = { items: [], position: 0, current: null, zoom: 0, request: 0 };
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));

    async function refreshList(preserveId = true) {
      const oldId = preserveId ? state.current?.id : null;
      const params = new URLSearchParams({ q: $('#search').value, status: $('#filter').value });
      const payload = await (await fetch('/api/list?' + params, { cache: 'no-store' })).json();
      state.items = payload.items;
      const located = oldId ? state.items.findIndex(item => item.id === oldId) : -1;
      state.position = located >= 0 ? located : Math.min(state.position, Math.max(0, state.items.length - 1));
      $('#slider').max = Math.max(0, state.items.length - 1);
      if (state.items.length) await show(state.position);
      else showEmpty();
    }

    async function show(position) {
      if (!state.items.length) return;
      state.position = Math.max(0, Math.min(position, state.items.length - 1));
      const request = ++state.request;
      const id = state.items[state.position].id;
      const detail = await (await fetch('/api/item?id=' + encodeURIComponent(id), { cache: 'no-store' })).json();
      if (request !== state.request) return;
      state.current = detail;
      $('#identity').textContent = [detail.id, detail.title].filter(Boolean).join(' · ');
      $('#transcript').textContent = detail.prediction || '[No visible transcription]';
      $('#charCount').textContent = detail.characters.toLocaleString() + ' characters';
      $('#positionText').textContent = `${state.position + 1} of ${state.items.length}`;
      $('#slider').value = state.position;
      $('#previous').disabled = state.position === 0;
      $('#next').disabled = state.position === state.items.length - 1;
      $('#badges').innerHTML = badges(detail);
      $('#details').innerHTML = details(detail);
      const image = $('#scan');
      image.onload = fitImage;
      image.src = detail.image_url;
      $('#download').onclick = () => location.href = '/api/transcript?id=' + encodeURIComponent(detail.id);
      $('#loading').style.display = 'none';
    }

    function badges(detail) {
      const values = [];
      if (!detail.incomplete) values.push('<span class="badge good">Complete generation</span>');
      if (detail.incomplete) values.push('<span class="badge warn">Incomplete</span>');
      if (detail.truncated) values.push('<span class="badge warn">Truncated</span>');
      if (detail.omission) values.push('<span class="badge warn">Omission marker</span>');
      if (detail.loc_draft) values.push('<span class="badge good">LOC-format draft</span>');
      if (detail.loc_draft && detail.loc_automatic_checks_passed) values.push('<span class="badge good">Format checks passed</span>');
      if (detail.loc_audit_flags?.length) values.push(`<span class="badge warn">${detail.loc_audit_flags.length} LOC review flag${detail.loc_audit_flags.length === 1 ? '' : 's'}</span>`);
      return values.join('');
    }

    function details(detail) {
      const rows = [
        `<span>Item: ${escapeHtml(detail.item_id || 'unknown')} · Page: ${escapeHtml(detail.page_number ?? '—')} · Writer: ${escapeHtml(detail.writer_name)}</span>`,
        `<span>Source image: ${escapeHtml(detail.image_path)}</span>`,
      ];
      if (detail.reasons.length) rows.push(`<span>Generation flags: ${escapeHtml(detail.reasons.join(', '))}</span>`);
      if (detail.loc_human_review_required) rows.push('<span>LOC status: draft only · full line-by-line visual review required</span>');
      if (detail.loc_audit_flags?.length) rows.push(`<span>LOC review flags: ${escapeHtml(detail.loc_audit_flags.join(', '))}</span>`);
      if (detail.loc_url) rows.push(`<a href="${escapeHtml(detail.loc_url)}" target="_blank" rel="noreferrer">Open LOC record ↗</a>`);
      return rows.join('');
    }

    function showEmpty() {
      state.current = null;
      $('#identity').textContent = 'No pages match this filter';
      $('#badges').innerHTML = '';
      $('#scan').removeAttribute('src');
      $('#transcript').textContent = 'No pages match this filter. Try another search or generation status.';
      $('#charCount').textContent = '';
      $('#details').innerHTML = '';
      $('#positionText').textContent = '0 of 0';
      $('#loading').style.display = 'none';
    }

    function fitImage() {
      const image = $('#scan');
      const stage = $('#imageStage');
      if (!image.naturalWidth || !image.naturalHeight) return;
      const widthScale = Math.max(.05, (stage.clientWidth - 36) / image.naturalWidth);
      const heightScale = Math.max(.05, (stage.clientHeight - 36) / image.naturalHeight);
      setZoom(Math.min(widthScale, heightScale), true);
    }

    function setZoom(value, fitted = false) {
      state.zoom = Math.max(.08, Math.min(4, value));
      const image = $('#scan');
      image.style.width = `${image.naturalWidth * state.zoom}px`;
      image.style.height = 'auto';
      $('#zoomLabel').textContent = fitted ? 'Fit' : `${Math.round(state.zoom * 100)}%`;
    }

    function move(delta) { show(state.position + delta); }
    $('#previous').onclick = () => move(-1);
    $('#next').onclick = () => move(1);
    $('#slider').oninput = event => show(Number(event.target.value));
    $('#zoomIn').onclick = () => setZoom(state.zoom * 1.2);
    $('#zoomOut').onclick = () => setZoom(state.zoom / 1.2);
    $('#fit').onclick = fitImage;
    $('#copy').onclick = async () => {
      if (!state.current) return;
      await navigator.clipboard.writeText(state.current.prediction);
      const button = $('#copy'); button.textContent = 'Copied'; setTimeout(() => button.textContent = 'Copy transcript', 900);
    };
    $('#filter').onchange = () => refreshList(false);
    let searchTimer;
    $('#search').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => refreshList(false), 180); };
    addEventListener('keydown', event => {
      if (event.target.matches('input, select')) return;
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'k') { event.preventDefault(); move(-1); }
      if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'j') { event.preventDefault(); move(1); }
      if (event.key === '+' || event.key === '=') setZoom(state.zoom * 1.2);
      if (event.key === '-') setZoom(state.zoom / 1.2);
      if (event.key.toLowerCase() === 'f') fitImage();
    });
    refreshList(false).catch(error => {
      $('#loading').textContent = 'Could not load the transcript data: ' + error.message;
    });
    setInterval(() => refreshList(true).catch(() => {}), 15000);
  </script>
</body>
</html>
